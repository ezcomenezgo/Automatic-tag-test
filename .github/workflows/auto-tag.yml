name: Auto Bump Tag on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [develop]

concurrency:
  group: auto-tag-group       # Unique group name for concurrency control
  cancel-in-progress: false  # Ensure that subsequent runs are queued instead of being canceled

jobs:
  bump-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # key： with PAT for invoking other on: push: tags workflows when pushing new tags
          token: ${{ secrets.PAT_TOKEN }}

      - name: Calculate and Push New Tag
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [[ "$PR_TITLE" =~ ^feat: ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "$PR_TITLE" =~ ^fix: ]]; then
            PATCH=$((PATCH + 1))
          else
            echo "PR title does not contain feat: or fix:, skipping tag."
            exit 0
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG